<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clawdbot Voice - OS1</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="os1-container">
        <!-- Ambient background particles -->
        <div class="particles" id="particles"></div>

        <!-- Main content -->
        <div class="content">
            <!-- Logo/Title area -->
            <div class="header">
                <div class="os1-logo">
                    <div class="logo-circle">
                        <div class="logo-inner"></div>
                    </div>
                </div>
                <h1 class="title">Clawdbot</h1>
                <p class="subtitle">Your AI Companion</p>
            </div>

            <!-- Voice interaction area -->
            <div class="voice-area">
                <!-- Waveform visualization -->
                <div class="waveform" id="waveform">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>

                <!-- Voice buttons -->
                <div class="voice-buttons">
                    <!-- Sexy Assistant Voice -->
                    <button class="voice-btn assistant-btn" id="assistantBtn" data-audio="audio/assistant.mp3">
                        <div class="btn-glow"></div>
                        <div class="btn-content">
                            <div class="btn-icon">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 14C14.2091 14 16 12.2091 16 10C16 7.79086 14.2091 6 12 6C9.79086 6 8 7.79086 8 10C8 12.2091 9.79086 14 12 14Z" stroke="currentColor" stroke-width="1.5"/>
                                    <path d="M12 14V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                    <path d="M8 18H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </div>
                            <span class="btn-label">Assistant</span>
                            <span class="btn-description">She speaks to Clawd for you</span>
                        </div>
                        <div class="btn-ring"></div>
                    </button>

                    <!-- Lobster Voice -->
                    <button class="voice-btn lobster-btn" id="lobsterBtn" data-audio="audio/lobster.mp3">
                        <div class="btn-glow"></div>
                        <div class="btn-content">
                            <div class="btn-icon">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 3C7.5 3 4 6 4 10C4 12 5 14 6.5 15.5L5 21L8.5 19L12 21L15.5 19L19 21L17.5 15.5C19 14 20 12 20 10C20 6 16.5 3 12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                                    <circle cx="9" cy="9" r="1" fill="currentColor"/>
                                    <circle cx="15" cy="9" r="1" fill="currentColor"/>
                                    <path d="M9 13C9 13 10.5 15 12 15C13.5 15 15 13 15 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <span class="btn-label">Clawdbot</span>
                            <span class="btn-description">The lobster speaks directly</span>
                        </div>
                        <div class="btn-ring"></div>
                    </button>
                </div>

                <!-- Status message -->
                <div class="status" id="status">
                    <span class="status-dot"></span>
                    <span class="status-text">Ready to listen</span>
                </div>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <a href="https://docs.clawd.bot/" target="_blank" rel="noopener">docs.clawd.bot</a>
                <span class="divider">|</span>
                <span>Powered by Claude</span>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
