<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CLAWD OS1</title>
  
  <!-- Native app feel -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CLAWD OS1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#C84536">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicons - Cross-browser support -->
  <!-- Standard favicon for most browsers -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <!-- SVG favicon for modern browsers (scales perfectly) -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <!-- PNG fallback for browsers that don't support SVG favicons -->
  <link rel="shortcut icon" href="favicon.png">
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  
  <!-- Microsoft Tiles -->
  <meta name="msapplication-TileColor" content="#C84536">
  <meta name="msapplication-TileImage" content="icons/mstile-150x150.png">
  <meta name="msapplication-config" content="browserconfig.xml">
  
  <!-- Fonts: Self-hosted for full offline support -->
  <link rel="stylesheet" href="src/fonts/fonts.css">
  
  <!-- Global Styles -->
  <link rel="stylesheet" href="src/styles/index.css">

  <!-- Import Map for Preact Shadow Component System -->
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.23.1",
      "preact/": "https://esm.sh/preact@10.23.1/",
      "preact/hooks": "https://esm.sh/preact@10.23.1/hooks",
      "@preact/signals": "https://esm.sh/@preact/signals@1.3.0?external=preact",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "comlink": "https://esm.sh/comlink@4.4.1"
    }
  }
  </script>
</head>
<body>
  <div class="app-container">
    
    <!-- OS Header with Declarative Shadow DOM -->
    <os-header badge="OS1">
      <template shadowrootmode="open">
        <link rel="stylesheet" href="src/components/styles/os-header.css">
        <div class="badge">OS1</div>
        <time class="clock">12:00</time>
      </template>
    </os-header>

    <!-- Main canvas -->
    <main class="app-main">
      
      <!-- Voice Cards -->
      <div class="voice-cards-container">
        
        <!-- Her - The Assistant -->
        <voice-card id="assistantCard" voice="her" audio-src="audio/assistant.mp3" delay="1">
          <template shadowrootmode="open">
            <link rel="stylesheet" href="src/components/styles/voice-card.css">
            <div class="svg-container">
              <slot name="svg"></slot>
              <div class="ripple"></div>
            </div>
            <div class="line"></div>
            <div class="text">
              <span class="title"><slot name="title">Voice</slot></span>
              <span class="subtitle"><slot name="subtitle">description</slot></span>
            </div>
          </template>
          
          <svg slot="svg" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg" class="figure-svg">
            <path d="M60 80 Q30 100, 40 140 Q50 180, 70 200" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw"/>
            <path d="M140 80 Q170 100, 160 140 Q150 180, 130 200" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.2s"/>
            <ellipse cx="100" cy="70" rx="35" ry="45" stroke="currentColor" stroke-width="2" fill="none" class="line-draw" style="animation-delay: 0.4s"/>
            <path d="M75 110 Q100 130, 125 110" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.6s"/>
            <path d="M85 125 Q70 160, 80 200 Q90 240, 100 260" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.8s"/>
            <path d="M115 125 Q130 160, 120 200 Q110 240, 100 260" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1s"/>
            <path d="M75 140 Q50 160, 45 190 Q42 210, 50 220" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1.2s"/>
            <path d="M125 140 Q150 160, 155 190 Q158 210, 150 220" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1.4s"/>
          </svg>
          <span slot="title">Her</span>
          <span slot="subtitle">speaks to Clawd for you</span>
        </voice-card>

        <!-- Clawd - The Lobster -->
        <voice-card id="lobsterCard" voice="clawd" audio-src="audio/lobster.mp3" delay="2">
          <template shadowrootmode="open">
            <link rel="stylesheet" href="src/components/styles/voice-card.css">
            <div class="svg-container">
              <slot name="svg"></slot>
              <div class="ripple"></div>
            </div>
            <div class="line"></div>
            <div class="text">
              <span class="title"><slot name="title">Voice</slot></span>
              <span class="subtitle"><slot name="subtitle">description</slot></span>
            </div>
          </template>
          
          <svg slot="svg" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg" class="figure-svg">
            <path d="M100 120 Q60 100, 40 120 Q20 140, 40 160 Q60 180, 100 160 Q140 180, 160 160 Q180 140, 160 120 Q140 100, 100 120" stroke="currentColor" stroke-width="2" fill="none" class="line-draw"/>
            <path d="M100 160 Q95 190, 90 210 Q85 230, 80 250" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.2s"/>
            <path d="M100 160 Q105 190, 110 210 Q115 230, 120 250" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.3s"/>
            <path d="M80 250 Q100 260, 120 250" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.4s"/>
            <path d="M40 130 Q20 110, 15 90 Q10 70, 25 60 Q40 50, 50 65 Q55 80, 45 90" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.5s"/>
            <path d="M25 60 Q15 50, 10 40" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.6s"/>
            <path d="M50 65 Q55 55, 60 45" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.7s"/>
            <path d="M160 130 Q180 110, 185 90 Q190 70, 175 60 Q160 50, 150 65 Q145 80, 155 90" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.8s"/>
            <path d="M175 60 Q185 50, 190 40" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.9s"/>
            <path d="M150 65 Q145 55, 140 45" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1s"/>
            <path d="M85 115 Q70 90, 60 60 Q55 40, 65 30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1.1s"/>
            <path d="M115 115 Q130 90, 140 60 Q145 40, 135 30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1.2s"/>
            <circle cx="85" cy="125" r="4" stroke="currentColor" stroke-width="2" fill="none" class="line-draw" style="animation-delay: 1.3s"/>
            <circle cx="115" cy="125" r="4" stroke="currentColor" stroke-width="2" fill="none" class="line-draw" style="animation-delay: 1.4s"/>
          </svg>
          <span slot="title">Clawd</span>
          <span slot="subtitle">the lobster speaks directly</span>
        </voice-card>
      </div>

      <!-- Waveform -->
      <wave-form id="waveform" bars="7">
        <template shadowrootmode="open">
          <link rel="stylesheet" href="src/components/styles/wave-form.css">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </template>
      </wave-form>

      <!-- GPU Waveform - WebGPU HDR powered, always animated -->
      <gpu-waveform id="gpuWaveform"></gpu-waveform>

      <!-- Transcription -->
      <transcription-display id="transcription">
        <template shadowrootmode="open">
          <link rel="stylesheet" href="src/components/styles/transcription-display.css">
          <span class="text"><slot></slot></span>
        </template>
      </transcription-display>

      <!-- Speak Button -->
      <speak-button id="speakBtn">
        <template shadowrootmode="open">
          <link rel="stylesheet" href="src/components/styles/speak-button.css">
          <button type="button">
            <span class="text"><slot>tap to speak</slot></span>
            <div class="ripple"></div>
          </button>
        </template>
        tap to speak
      </speak-button>

      <!-- Status -->
      <status-display id="status">
        <template shadowrootmode="open">
          <link rel="stylesheet" href="src/components/styles/status-display.css">
          <span class="text"><slot>ready</slot></span>
        </template>
        ready
      </status-display>
    </main>

    <!-- Footer -->
    <app-footer class="app-footer">
      <template shadowrootmode="open">
        <link rel="stylesheet" href="src/components/styles/app-footer.css">
        <a class="title" href="https://clawdbot.com/" target="_blank" rel="noopener">
          <slot name="title">Clawd</slot>
        </a>
        <div class="tagline"><slot name="tagline">a voice experience</slot></div>
        <a class="author" href="https://x.com/gunta85" target="_blank" rel="noopener">
          <slot name="author">by gunta</slot>
        </a>
      </template>
      <span slot="title">Clawd</span>
      <span slot="tagline">a voice experience</span>
      <span slot="author">by gunta</span>
    </app-footer>
  </div>

  <!-- Files App - Spatial File Browser -->
  <files-app id="filesApp">
    <template shadowrootmode="open">
      <style>:host{position:fixed;inset:0;opacity:0;visibility:hidden}</style>
      <link rel="stylesheet" href="src/components/styles/files-app.css">
      
      <div class="header">
        <div class="header-left">
          <button class="back-btn" type="button" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M15 18L9 12L15 6" />
            </svg>
            <span class="back-btn-text">back</span>
          </button>
          <span class="title">files</span>
        </div>
        <div class="path">/</div>
        <button class="close-btn" type="button" aria-label="Close files">
          <svg viewBox="0 0 24 24" fill="none">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      
      <div class="canvas-container">
        <div class="canvas"></div>
        <div class="zoom-indicator">100%</div>
      </div>
      
      <!-- Context Menu -->
      <div class="context-menu" role="menu" aria-label="File actions">
        <button class="context-menu-item" data-action="open" role="menuitem">
          <svg viewBox="0 0 24 24">
            <path d="M21 2.992V7h-4.992M3 21.008V17h4.992M21 7C20 3.5 17 2 12 2S4 3.5 3 7m0 10c1 3.5 4 5 9 5s8-1.5 9-5"/>
          </svg>
          <span>Open</span>
        </button>
        <button class="context-menu-item" data-action="copy" role="menuitem">
          <svg viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          <span>Copy</span>
        </button>
        <button class="context-menu-item" data-action="download" role="menuitem">
          <svg viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download</span>
        </button>
        <div class="context-menu-separator"></div>
        <button class="context-menu-item context-menu-item--danger" data-action="delete" role="menuitem">
          <svg viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
          <span>Delete</span>
        </button>
      </div>
      
      <div class="time-scrubber">
        <span class="time-label">past</span>
        <div class="time-slider">
          <div class="time-slider-fill"></div>
          <div class="time-slider-thumb"></div>
        </div>
        <span class="time-label">now</span>
      </div>
    </template>
  </files-app>

  <!-- Commands App - Terminal Interface -->
  <commands-app id="commandsApp">
    <template shadowrootmode="open">
      <style>:host{position:fixed;inset:0;opacity:0;visibility:hidden}</style>
      <link rel="stylesheet" href="src/components/styles/commands-app.css">
      
      <div class="header">
        <div class="header-left">
          <button class="back-btn" type="button" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M15 18L9 12L15 6" />
            </svg>
            <span class="back-btn-text">back</span>
          </button>
          <span class="title">commands</span>
        </div>
        <span class="path-display">/</span>
        <button class="close-btn" type="button" aria-label="Close terminal">
          <svg viewBox="0 0 24 24" fill="none">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      
      <div class="terminal-container">
        <div class="terminal-wrapper"></div>
      </div>
      
      <div class="status-bar">
        <div class="status-bar-left">
          <span class="status-item">
            <svg viewBox="0 0 24 24">
              <polyline points="4 17 10 11 4 5" />
            </svg>
            bash
          </span>
        </div>
        <span class="status-item">AgentFS</span>
      </div>
    </template>
  </commands-app>

  <!-- Launchpad - App Launcher -->
  <launchpad-view id="launchpad">
    <template shadowrootmode="open">
      <style>:host{position:fixed;inset:0;opacity:0;visibility:hidden}</style>
      <link rel="stylesheet" href="src/components/styles/launchpad-view.css">

      <div class="header">
        <span class="title">apps</span>
        <button class="close-btn" type="button" aria-label="Close launchpad">
          <svg viewBox="0 0 24 24" fill="none">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>

      <!-- Command Palette Search -->
      <div class="command-palette">
        <div class="command-input-wrapper">
          <svg class="command-icon" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            class="command-input"
            placeholder="Search apps, run commands, find files..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button type="button" class="command-clear" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
          <span class="command-shortcut">⌘K</span>
        </div>
      </div>

      <!-- Search Results -->
      <div class="search-results" style="display: none;"></div>

      <div class="apps-grid">
        <!-- Files App -->
        <div class="app-card" data-app="files" tabindex="0" role="button" aria-label="Open Files">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <path d="M3 7V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V9C21 7.89543 20.1046 7 19 7H13L11 5H5C3.89543 5 3 5.89543 3 7Z" />
            </svg>
          </div>
          <span class="app-name">files</span>
        </div>
        
        <!-- Commands App (Terminal) -->
        <div class="app-card" data-app="commands" tabindex="0" role="button" aria-label="Open Commands">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <polyline points="4 17 10 11 4 5" />
              <line x1="12" y1="19" x2="20" y2="19" />
            </svg>
          </div>
          <span class="app-name">commands</span>
        </div>
        
        <!-- Code App (Monaco Editor) -->
        <div class="app-card" data-app="coder" tabindex="0" role="button" aria-label="Open Code">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
          </div>
          <span class="app-name">code</span>
        </div>
        
        <!-- Voice App (current view) -->
        <div class="app-card" data-app="voice" data-active="true" tabindex="0" role="button" aria-label="Open Voice">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 1C10.34 1 9 2.34 9 4V12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12V4C15 2.34 13.66 1 12 1Z" />
              <path d="M19 10V12C19 15.87 15.87 19 12 19C8.13 19 5 15.87 5 12V10" />
              <line x1="12" y1="19" x2="12" y2="23" />
              <line x1="8" y1="23" x2="16" y2="23" />
            </svg>
          </div>
          <span class="app-name">voice</span>
        </div>
        
        <!-- Settings App -->
        <div class="app-card" data-app="settings" tabindex="0" role="button" aria-label="Open Settings">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </div>
          <span class="app-name">settings</span>
        </div>
        
        <!-- Images App -->
        <div class="app-card" data-app="image-viewer" tabindex="0" role="button" aria-label="Open Images">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
          </div>
          <span class="app-name">images</span>
        </div>

        <!-- Connections App -->
        <div class="app-card" data-app="connections" tabindex="0" role="button" aria-label="Open Connections">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
            </svg>
          </div>
          <span class="app-name">connections</span>
        </div>
      </div>
    </template>
  </launchpad-view>

  <!-- Text Editor - Native text editor for files -->
  <text-editor id="textEditor"></text-editor>

  <!-- Coder App - Monaco-powered code editor -->
  <coder-app id="coderApp">
    <template shadowrootmode="open">
      <style>:host{position:fixed;inset:0;opacity:0;visibility:hidden}</style>
      <link rel="stylesheet" href="src/components/styles/coder-app.css">
      
      <div class="header">
        <div class="header-left">
          <button class="back-btn" type="button" aria-label="Back to Files">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M19 12H5M5 12L12 19M5 12L12 5" />
            </svg>
          </button>
        </div>
        <div class="title-area">
          <span class="title">Untitled</span>
          <span class="status"></span>
        </div>
        <div class="header-right">
          <button class="save-btn" type="button" aria-label="Save file">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16L21 8V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21Z" />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
            <span>Save</span>
          </button>
          <button class="close-btn" type="button" aria-label="Close editor">
            <svg viewBox="0 0 24 24" fill="none">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>
      
      <div class="editor-container">
        <div class="editor-wrapper"></div>
        <div class="loading-overlay">
          <div class="loading-spinner"></div>
          <span class="loading-text">Loading editor...</span>
        </div>
      </div>
      
      <div class="footer">
        <span class="language-info">Plain Text</span>
        <span class="cursor-position">Ln 1, Col 1</span>
      </div>
    </template>
  </coder-app>

  <!-- Settings App - OS Configuration Panel -->
  <settings-app id="settingsApp"></settings-app>

  <!-- Connections App - Data Sync & Backup -->
  <connections-app id="connectionsApp"></connections-app>

  <!-- Image Viewer App - Elegant Image Gallery -->
  <image-viewer-app id="imageViewerApp">
    <template shadowrootmode="open">
      <style>:host{position:fixed;inset:0;opacity:0;visibility:hidden}</style>
      <link rel="stylesheet" href="src/components/styles/image-viewer-app.css">
      
      <div class="header">
        <div class="header-left">
          <span class="counter">1 / 10</span>
        </div>
        <div class="header-center">
          <span class="title">Image</span>
          <span class="image-info">1920 × 1080 • PNG</span>
        </div>
        <div class="header-right">
          <button class="close-btn" type="button" aria-label="Close viewer">
            <svg viewBox="0 0 24 24" fill="none">
              <line x1="6" y1="6" x2="18" y2="18" />
              <line x1="18" y1="6" x2="6" y2="18" />
            </svg>
          </button>
        </div>
      </div>
      
      <div class="image-container">
        <img class="image-display" alt="Image preview" />
        
        <div class="nav-overlay left">
          <button class="nav-btn prev-btn" type="button" aria-label="Previous image">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M15 18L9 12L15 6" />
            </svg>
          </button>
        </div>
        
        <div class="nav-overlay right">
          <button class="nav-btn next-btn" type="button" aria-label="Next image">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M9 6L15 12L9 18" />
            </svg>
          </button>
        </div>
        
        <div class="loading-overlay">
          <div class="loading-spinner"></div>
        </div>
      </div>
      
      <div class="footer">
        <div class="zoom-controls">
          <button class="zoom-btn zoom-out-btn" type="button" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="8" />
              <line x1="7" y1="11" x2="15" y2="11" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <button class="zoom-btn zoom-reset-btn" type="button" aria-label="Reset zoom">100%</button>
          <button class="zoom-btn zoom-in-btn" type="button" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="8" />
              <line x1="11" y1="7" x2="11" y2="15" />
              <line x1="7" y1="11" x2="15" y2="11" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
        </div>
      </div>
    </template>
  </image-viewer-app>

  <!-- Clock Modal - Bold, simple analog clock -->
  <clock-modal id="clockModal">
    <template shadowrootmode="open">
      <style>:host{position:fixed;inset:0;opacity:0;visibility:hidden}</style>
      <link rel="stylesheet" href="src/components/styles/clock-modal.css">
      
      <button class="close-btn" type="button" aria-label="Close clock">
        <svg viewBox="0 0 24 24" fill="none">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>
      
      <div class="date-display" id="dateDisplay"></div>
      
      <div class="clock-container">
        <svg class="clock-svg" viewBox="0 0 400 400">
          <!-- Clock face -->
          <circle class="clock-face" cx="200" cy="200" r="175" />
          
          <!-- Hour markers -->
          <line class="hour-marker" x1="200" y1="45" x2="200" y2="28" />
          <line class="hour-marker" x1="277.5" y1="67.5" x2="289.5" y2="55.5" />
          <line class="hour-marker" x1="355" y1="200" x2="372" y2="200" />
          <line class="hour-marker" x1="277.5" y1="332.5" x2="289.5" y2="344.5" />
          <line class="hour-marker" x1="200" y1="355" x2="200" y2="372" />
          <line class="hour-marker" x1="122.5" y1="332.5" x2="110.5" y2="344.5" />
          <line class="hour-marker" x1="45" y1="200" x2="28" y2="200" />
          <line class="hour-marker" x1="122.5" y1="67.5" x2="110.5" y2="55.5" />
          <line class="hour-marker" x1="243.3" y1="53.4" x2="251.7" y2="38.8" />
          <line class="hour-marker" x1="156.7" y1="53.4" x2="148.3" y2="38.8" />
          <line class="hour-marker" x1="346.6" y1="156.7" x2="361.2" y2="148.3" />
          <line class="hour-marker" x1="346.6" y1="243.3" x2="361.2" y2="251.7" />
          
          <!-- Roman numerals -->
          <text class="numeral" x="200" y="80">XII</text>
          <text class="numeral" x="265" y="98">I</text>
          <text class="numeral" x="310" y="143">II</text>
          <text class="numeral" x="325" y="205">III</text>
          <text class="numeral" x="310" y="265">IV</text>
          <text class="numeral" x="265" y="310">V</text>
          <text class="numeral" x="200" y="328">VI</text>
          <text class="numeral" x="135" y="310">VII</text>
          <text class="numeral" x="88" y="265">VIII</text>
          <text class="numeral" x="75" y="205">IX</text>
          <text class="numeral" x="88" y="143">X</text>
          <text class="numeral" x="135" y="98">XI</text>
          
          <!-- Clock hands -->
          <line class="hand hand-hour" id="hourHand" x1="200" y1="200" x2="200" y2="100" />
          <line class="hand hand-minute" id="minuteHand" x1="200" y1="200" x2="200" y2="60" />
          <line class="hand hand-second" id="secondHand" x1="200" y1="230" x2="200" y2="55" />
          
          <!-- Center dot -->
          <circle class="center-dot" cx="200" cy="200" r="6" />
        </svg>
      </div>
      
      <div class="digital-time" id="digitalTime"></div>
    </template>
  </clock-modal>

  <!-- Drop Zone - Global drag & drop file upload -->
  <drop-zone id="dropZone"></drop-zone>

  <!-- App Entry Point -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
