<svg viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg" class="figure-svg">
  <!-- Body - infinity-like curves morphing into lobster -->
  <path d="M100 120 Q60 100, 40 120 Q20 140, 40 160 Q60 180, 100 160 Q140 180, 160 160 Q180 140, 160 120 Q140 100, 100 120" stroke="currentColor" stroke-width="2" fill="none" class="line-draw"/>
  
  <!-- Tail - flowing curves -->
  <path d="M100 160 Q95 190, 90 210 Q85 230, 80 250" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.2s"/>
  <path d="M100 160 Q105 190, 110 210 Q115 230, 120 250" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.3s"/>
  <path d="M80 250 Q100 260, 120 250" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.4s"/>
  
  <!-- Claws -->
  <path d="M40 130 Q20 110, 15 90 Q10 70, 25 60 Q40 50, 50 65 Q55 80, 45 90" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.5s"/>
  <path d="M25 60 Q15 50, 10 40" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.6s"/>
  <path d="M50 65 Q55 55, 60 45" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.7s"/>
  
  <path d="M160 130 Q180 110, 185 90 Q190 70, 175 60 Q160 50, 150 65 Q145 80, 155 90" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.8s"/>
  <path d="M175 60 Q185 50, 190 40" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 0.9s"/>
  <path d="M150 65 Q145 55, 140 45" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1s"/>
  
  <!-- Antennae -->
  <path d="M85 115 Q70 90, 60 60 Q55 40, 65 30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1.1s"/>
  <path d="M115 115 Q130 90, 140 60 Q145 40, 135 30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" class="line-draw" style="animation-delay: 1.2s"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="125" r="4" stroke="currentColor" stroke-width="2" fill="none" class="line-draw" style="animation-delay: 1.3s"/>
  <circle cx="115" cy="125" r="4" stroke="currentColor" stroke-width="2" fill="none" class="line-draw" style="animation-delay: 1.4s"/>
</svg>
