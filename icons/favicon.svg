<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#C84536"/>
  <g transform="translate(256, 240)" stroke="rgba(255,255,255,0.95)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main body - lobster shape -->
    <path d="M0 20 Q-80 0, -120 20 Q-160 40, -120 60 Q-80 80, 0 60 Q80 80, 120 60 Q160 40, 120 20 Q80 0, 0 20"/>
    
    <!-- Tail -->
    <path d="M0 60 Q-10 100, -20 130 Q-30 160, -40 180"/>
    <path d="M0 60 Q10 100, 20 130 Q30 160, 40 180"/>
    <path d="M-40 180 Q0 200, 40 180"/>
    
    <!-- Left claw -->
    <path d="M-100 30 Q-140 0, -160 -30 Q-180 -60, -160 -80 Q-140 -100, -115 -85 Q-100 -70, -110 -50"/>
    <path d="M-160 -80 Q-180 -100, -190 -120"/>
    <path d="M-115 -85 Q-105 -100, -95 -115"/>
    
    <!-- Right claw -->
    <path d="M100 30 Q140 0, 160 -30 Q180 -60, 160 -80 Q140 -100, 115 -85 Q100 -70, 110 -50"/>
    <path d="M160 -80 Q180 -100, 190 -120"/>
    <path d="M115 -85 Q105 -100, 95 -115"/>
    
    <!-- Antennae -->
    <path d="M-30 15 Q-60 -30, -80 -80 Q-90 -110, -75 -130"/>
    <path d="M30 15 Q60 -30, 80 -80 Q90 -110, 75 -130"/>
    
    <!-- Eyes -->
    <circle cx="-30" cy="30" r="8" fill="none"/>
    <circle cx="30" cy="30" r="8" fill="none"/>
  </g>
</svg>
