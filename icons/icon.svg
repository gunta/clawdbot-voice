<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#C84536"/>
  <!-- Breathing orb representation -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <circle cx="256" cy="256" r="40" fill="rgba(255,255,255,0.4)"/>
  <!-- Subtle glow effect -->
  <circle cx="256" cy="256" r="100" fill="url(#glow)" opacity="0.3"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
